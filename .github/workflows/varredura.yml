# Varre as checagens a cada 10 minutos.
#
# - Se o g1 mudou alguma checagem (arquivo novo em data/scans), faz commit na main:
#   a Vercel publica o site de novo.
# - Sempre: grava data/status.json (horário da última verificação e erro, se houver) no
#   branch "status", com um único commit sobrescrito. Esse branch não gera deploy, e o
#   site lê o arquivo direto do GitHub. Assim não estouramos o limite de deploys da Vercel.
name: Varredura

on:
  # Agendamento desligado: as checagens dos debates terminaram (24/10/2026).
  # Para religar num próximo debate, descomente as duas linhas abaixo.
  # A cada 10 minutos, nos minutos 3, 13, 23... O GitHub recomenda fugir da virada da hora,
  # quando a fila de agendamentos fica cheia e execuções podem atrasar ou ser puladas.
  # schedule:
  #   - cron: '3-59/10 * * * *'
  workflow_dispatch:          # botão "Run workflow" na aba Actions

permissions:
  contents: write

concurrency:
  group: varredura
  cancel-in-progress: false

jobs:
  varrer:
    # Windows PowerShell 5.1: o mesmo ambiente em que o script roda localmente.
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      # Os horários gravados já saem em horário de Brasília (ver Get-Agora em lib/FatoOuFake.ps1).
      - name: Varrer debates
        shell: powershell
        run: .\scripts\varrer.ps1 -Publico

      # Roda mesmo se algum debate falhou: o erro fica registrado no status.
      - name: Salvar resultados
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # --global: vale também para o repositório temporário do branch status.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          quando="$(TZ=BRT3 date '+%d/%m %H:%M') (Brasília)"

          if [ -n "$(git status --porcelain -- data/scans)" ]; then
            git add data
            git commit -m "Varredura $quando"
            git pull --rebase
            git push
            echo "Checagem mudou: commit na main."
          else
            echo "Nada mudou na checagem; só o status será atualizado."
          fi

          if [ -f data/status.json ]; then
            dir="$RUNNER_TEMP/status"
            rm -rf "$dir" && mkdir -p "$dir"
            cp data/status.json "$dir/status.json"
            cd "$dir"
            git init -q -b status
            git add status.json
            git commit -q -m "Status $quando"
            git push -fq "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" status
            echo "Status publicado no branch status."
          fi
