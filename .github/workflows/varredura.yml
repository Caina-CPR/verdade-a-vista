# Varre as checagens de hora em hora e grava o resultado em data/.
# Cada commit desta automação dispara um novo deploy na Vercel.
name: Varredura

on:
  schedule:
    - cron: '7 * * * *'   # minuto 7 de toda hora (UTC); o GitHub pode atrasar alguns minutos
  workflow_dispatch:       # botão "Run workflow" na aba Actions

permissions:
  contents: write

concurrency:
  group: varredura
  cancel-in-progress: false

jobs:
  varrer:
    # Windows PowerShell 5.1: o mesmo ambiente em que o script roda localmente.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Varrer debates
        shell: powershell
        run: |
          tzutil /s "E. South America Standard Time"
          .\scripts\varrer.ps1 -Publico

      # Grava mesmo se algum debate falhou: o erro fica registrado em data/status.json.
      - name: Salvar resultados
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nada para salvar."
            exit 0
          fi
          git commit -m "Varredura $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          git pull --rebase
          git push
